name: Manual TalentOS company sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run authenticated CRM sync
        env:
          WORKFLOW_RUNNER_SECRET: ${{ secrets.WORKFLOW_RUNNER_SECRET }}
          CRM_INTEGRATION_SECRET: ${{ secrets.CRM_INTEGRATION_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${WORKFLOW_RUNNER_SECRET}" \
            "https://skarion-cron.skarion-talentos.workers.dev/run-now?syncCompanies=1" \
            | tee sync-result.json

          page=1
          : > talentos-companies.csv
          echo 'id,name,website,linkedin_url' >> talentos-companies.csv
          while :; do
            payload="$(curl --fail-with-body --max-time 60 \
              --header "Authorization: Bearer ${CRM_INTEGRATION_SECRET}" \
              "https://skarion-talent-os.skarion-talentos.workers.dev/api/integrations/crm/companies?page=${page}&pageSize=100")"
            echo "$payload" | jq -r '.data[] | [(.id // ""), (.name // ""), (.website // ""), (.linkedin_url // "")] | @csv' >> talentos-companies.csv
            total="$(echo "$payload" | jq -r '.total // 0')"
            count=$((page * 100))
            [ "$count" -ge "$total" ] && break
            page=$((page + 1))
          done
          echo "Imported company count: $(($(wc -l < talentos-companies.csv) - 1))"
      - name: Upload company import log
        uses: actions/upload-artifact@v4
        with:
          name: talentos-company-sync-log
          path: |
            sync-result.json
            talentos-companies.csv
