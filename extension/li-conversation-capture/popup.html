<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skarion Conversation Capture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100%;
        min-width: 300px;
        min-height: 320px;
        font:
          14px/1.4 Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      header {
        padding: 16px 18px;
        color: white;
        background: linear-gradient(135deg, #0a66c2, #1d4ed8);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 2px 0 0;
        font-size: 12px;
        opacity: 0.85;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .gear {
        border: 0;
        background: rgba(255, 255, 255, 0.16);
        color: white;
        border-radius: 7px;
        padding: 7px 9px;
      }
      main {
        padding: 16px;
      }
      .card {
        background: white;
        border: 1px solid #dbe3ee;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .candidate-name {
        font-weight: 700;
        font-size: 16px;
      }
      .muted {
        color: #64748b;
        font-size: 12px;
        margin-top: 4px;
      }
      .status {
        padding: 10px 12px;
        border-radius: 8px;
        background: #eff6ff;
        color: #1d4ed8;
        min-height: 20px;
      }
      .status.error {
        background: #fef2f2;
        color: #b91c1c;
      }
      .status.success {
        background: #ecfdf5;
        color: #047857;
      }
      .progress {
        height: 6px;
        background: #e2e8f0;
        border-radius: 99px;
        overflow: hidden;
        margin-top: 9px;
      }
      .progress > div {
        height: 100%;
        width: 0;
        background: #2563eb;
        transition: width 0.25s;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 12px;
      }
      .action {
        border: 0;
        border-radius: 9px;
        padding: 11px 8px;
        font-weight: 700;
        color: white;
        background: #2563eb;
      }
      .action.draft {
        background: #7c3aed;
      }
      .action:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .action:not(:disabled):hover {
        filter: brightness(0.94);
      }
      .drafts {
        display: none;
        flex-direction: column;
        gap: 10px;
      }
      .drafts.open {
        display: flex;
      }
      .draft-card {
        border: 1px solid #dbe3ee;
        border-radius: 10px;
        padding: 10px;
        background: #fafbfd;
      }
      .draft-text {
        white-space: pre-wrap;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .copy {
        border: 1px solid #cbd5e1;
        background: white;
        border-radius: 7px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700;
        color: #1d4ed8;
      }
      .copy.copied {
        color: #047857;
        border-color: #a7f3d0;
      }
      .settings {
        display: none;
      }
      .settings.open {
        display: block;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        color: #475569;
        margin: 8px 0 4px;
      }
      input {
        width: 100%;
        padding: 9px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
      }
      .save {
        margin-top: 10px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px;
        background: #0f172a;
        color: white;
      }
      .privacy {
        color: #64748b;
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Skarion Conversation Capture</h1>
        <p>Ingest a LinkedIn thread, draft the reply</p>
      </div>
      <button class="gear" id="toggleSettings" aria-label="Settings">⚙</button>
    </header>
    <main>
      <section class="card settings" id="settings">
        <label for="crmUrl">CRM API URL</label>
        <input id="crmUrl" />
        <label for="apiKey">Personal extension API key</label>
        <input id="apiKey" type="password" />
        <button class="save" id="saveSettings">Save settings</button>
      </section>

      <section class="card">
        <div class="candidate-name" id="candidateName">Open a LinkedIn message thread</div>
        <div class="muted" id="candidateMeta">Then click Ingest.</div>
      </section>

      <section class="card">
        <div class="status" id="status">Ready.</div>
        <div class="progress"><div id="progress"></div></div>
        <div class="actions">
          <button class="action ingest" id="ingestButton">Ingest</button>
          <button class="action draft" id="draftButton" disabled>Draft</button>
        </div>
      </section>

      <section class="card drafts" id="draftsCard">
        <div class="muted" style="margin-bottom: 8px">Pick one, copy it, paste it into LinkedIn.</div>
        <div class="drafts open" id="draftsList"></div>
      </section>

      <div class="privacy">
        Nothing sends automatically. Ingest stores the conversation in CRM; Draft only generates
        text for you to review and copy.
      </div>
    </main>
    <script src="default-settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
