name = "skarion-crm-platform"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
APP_URL = "https://crm.skarion.com"
AI_PROVIDER = "vertex_proxy"
AI_MODEL_DEFAULT = "coding-cheap"
AI_MODEL_REASONING = "coding-cheap"
AI_MODEL_CHEAP = "coding-cheap"
AI_MODEL_FALLBACK = "coding-cheap"
AI_EMBEDDING_MODEL = "embedding"
TALENTOS_API_URL = "https://skarion-talent-os.skarion-talentos.workers.dev"
COMPANY_SYNC_OWNER_ID = "a77b7dc2-efab-478e-960b-3080e9d9b167"
GOOGLE_MODEL = "gemini-1.5-flash"
GOOGLE_FALLBACK_MODEL = "gemini-1.5-pro"
GOOGLE_EMBEDDING_MODEL = "text-embedding-004"
# Document converter service (optional — falls back to local PDF extractor if not set)
# DOCUMENT_CONVERTER_URL = "https://your-converter-service.example.com"
# DOCUMENT_AI_MAX_CHARS = "50000"

[env.staging.vars]
APP_URL = "https://skarion-crm-staging.pages.dev"
AI_PROVIDER = "vertex_proxy"
AI_MODEL_DEFAULT = "coding-cheap"
AI_MODEL_REASONING = "coding-cheap"
AI_MODEL_CHEAP = "coding-cheap"
AI_MODEL_FALLBACK = "coding-cheap"
AI_EMBEDDING_MODEL = "embedding"
TALENTOS_API_URL = "https://skarion-talent-os.skarion-talentos.workers.dev"
COMPANY_SYNC_OWNER_ID = "a77b7dc2-efab-478e-960b-3080e9d9b167"
GOOGLE_MODEL = "gemini-1.5-flash"
GOOGLE_FALLBACK_MODEL = "gemini-1.5-pro"
GOOGLE_EMBEDDING_MODEL = "text-embedding-004"

[[r2_buckets]]
binding = "ATTACHMENTS_BUCKET"
bucket_name = "skarion-attachments"
